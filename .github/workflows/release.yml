name: Release

# Push a tag like v1.0.2 to build Paskalista-1.0.2.zip and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/Paskalista
          # git archive skips files marked export-ignore in .gitattributes
          git archive HEAD | tar -x -C build/Paskalista
          sed -i "s/^## Version:.*/## Version: ${VERSION}/" build/Paskalista/Paskalista.toc
          (cd build && zip -r "../Paskalista-${VERSION}.zip" Paskalista)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Paskalista-${VERSION}.zip" \
            --title "Paskalista ${VERSION}" --generate-notes
